[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bandit-benchmark"
version = "0.1.0"
description = "Benchmarking Multi-Armed Bandits, Stationary MAB, CMAB, and Non-Stationary CMAB based on Bouneffouf & Rish (2019)"
authors = [{ name = "Harikrishnamoorthy T" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "nbformat>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
